<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAGE-001 — Login | AI Sales OS</title>
  <link rel="stylesheet" href="preview-base.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="preview-tag">PAGE-001 · SHELL-AUTH</div>

  <div class="app auth">
    <div class="login-wrap">
      <div class="card card-highlight" data-zone="Z-CENTER">
        <div class="logo login-logo">
          <div class="logo-icon"></div> AI Sales OS
        </div>
        <form data-zone="Z-FORM" class="form-grid">
          <div class="form-field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" placeholder="name@company.ru" />
          </div>
          <div class="form-field">
            <label for="password">Пароль</label>
            <input class="input" id="password" type="password" placeholder="••••••••" />
          </div>
          <button class="btn-primary btn-block" type="button">Войти</button>
        </form>
      </div>
      <div data-zone="Z-FOOTER" class="auth-footer">
        <a href="#" class="link-btn">Забыли пароль?</a>
      </div>
    </div>
  </div>
</body>
</html>
