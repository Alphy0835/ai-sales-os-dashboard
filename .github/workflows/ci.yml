name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_SECRET_KEY: "ci-test-django-secret-key-32chars-minimum"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  api-postgres:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_sales_os_test
          POSTGRES_USER: ai_sales_os
          POSTGRES_PASSWORD: ai_sales_os_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_sales_os -d ai_sales_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_SECRET_KEY: "ci-test-django-secret-key-32chars-minimum"
      DATABASE_URL: postgres://ai_sales_os:ai_sales_os_local@localhost:5432/ai_sales_os_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    env:
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_SECRET_KEY: "ci-test-django-secret-key-32chars-minimum"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.lock.txt

      - name: Prepare demo database
        working-directory: apps/api
        run: |
          python manage.py migrate
          python manage.py seed_demo
          python manage.py seed_integrations
          python manage.py seed_ai
          python manage.py seed_dashboard

      - name: Start API
        working-directory: apps/api
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start web and run E2E
        working-directory: apps/web
        env:
          API_BACKEND_URL: http://127.0.0.1:8000
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/login && break
            sleep 2
          done
          npm run test:e2e
